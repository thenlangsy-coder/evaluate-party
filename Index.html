<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      overflow: hidden;
    }

    /* ແຖບເມນູດ້ານເທິງພ້ອມປຸ່ມເປີດລິງໂດຍກົງ */
    .top-bar {
      height: 44px;
      padding: 0 12px;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      position: relative;
      z-index: 20;
    }
    .top-title {
      font-size: 14px;
      font-weight: 600;
      color: #1e293b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .direct-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 500;
      color: #ffffff;
      background: #2563eb;
      border: none;
      border-radius: 6px;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s ease;
    }
    .direct-btn:hover {
      background: #1d4ed8;
    }

    /* ພື້ນທີ່ສະແດງ Web App */
    .frame-container {
      position: relative;
      width: 100%;
      height: calc(100% - 44px);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* ໜ້າ Loading */
    #loading-overlay {
      position: absolute;
      inset: 0;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 10;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    #loading-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #cbd5e1;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      font-size: 14px;
      color: #475569;
    }
    .fallback-link {
      font-size: 13px;
      color: #2563eb;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <span class="top-title">Google Apps Script Web App</span>
    <a
      id="direct-open-btn"
      class="direct-btn"
      href="https://script.google.com/macros/s/AKfycbyupUyFfBNYWMpIDySG-85_pvCmLPHCtDlPRuCzh0W_ikDT6gaRtLNMpxNIQfAHb5MeuQ/exec"
      target="_blank"
      rel="noopener noreferrer"
    >
      ເປີດລິງໂດຍກົງ
    </a>
  </div>

  <div class="frame-container">
    <div id="loading-overlay">
      <div class="spinner"></div>
      <div class="loading-text">ກຳລັງໂຫຼດແອັບພລິເຄຊັນ...</div>
      <a
        class="fallback-link"
        href="https://script.google.com/macros/s/AKfycbyupUyFfBNYWMpIDySG-85_pvCmLPHCtDlPRuCzh0W_ikDT6gaRtLNMpxNIQfAHb5MeuQ/exec"
        target="_blank"
        rel="noopener noreferrer"
      >
        ໂຫຼດດົນເກີນໄປ? ກົດເປີດໃນແທັບໃໝ່
      </a>
    </div>

    <iframe
      id="webapp-frame"
      src="https://script.google.com/macros/s/AKfycbyupUyFfBNYWMpIDySG-85_pvCmLPHCtDlPRuCzh0W_ikDT6gaRtLNMpxNIQfAHb5MeuQ/exec"
      allow="clipboard-read; clipboard-write; camera; microphone"
      sandbox="allow-scripts allow-forms allow-popups allow-same-origin allow-downloads"
    ></iframe>
  </div>

  <script>
    const frame = document.getElementById("webapp-frame");
    const overlay = document.getElementById("loading-overlay");

    function hideLoading() {
      overlay.classList.add("hidden");
    }

    // ປິດໜ້າ Loading ເມື່ອ iframe ໂຫຼດສຳເລັດ
    frame.addEventListener("load", hideLoading);

    // ສຳຮອງ: ຖ້າຜ່ານໄປ 12 ວິນາທີແລ້ວ event load ບໍ່ເຮັດວຽກ ໃຫ້ປິດ overlay ອັດຕະໂນມັດ
    setTimeout(hideLoading, 12000);
  </script>
</body>
</html>
